name: Backend image

# Constrói a imagem da API em todo PR que mexe no backend (valida o Dockerfile, sem publicar) e publica no GHCR em dev/main.
# Tags: SHA completo (o que o deploy usa) e o apelido móvel da branch. Deploy e rollback usam sempre o SHA.
on:
  pull_request:
    branches: [main, dev]
    paths: ["backend/**", ".github/workflows/backend-image.yml"]
  push:
    branches: [main, dev]
    paths: ["backend/**", ".github/workflows/backend-image.yml"]

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: true

env:
  # ponytail: dono do GHCR = dono do repositório. Se o cluster só puder baixar de outro dono (ex.: o dos pacotes do
  # ComercialWeb), troque aqui e no deploy/k8s/prod/deployment.yaml.
  IMAGE: ghcr.io/${{ github.repository_owner }}/comercialweb-mobile-api

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
