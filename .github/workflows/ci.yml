name: CI

# Só depois do merge (push em dev/main): PR não roda CI, para poupar minutos do GitHub Actions.
on:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
      # Tudo em paralelo no mesmo job (mesmo custo de minutos, menos espera). Falha se qualquer um falhar.
      # Audit: node-forge (GHSA-86w9-cpqp-85rv) entra só via @expo/cli (ferramenta de build, não roda no app)
      # e ainda não tem versão corrigida; voltar para high quando o Expo publicar o fix.
      - name: Lint, typecheck, testes, audit e bundle (paralelo)
        shell: bash
        run: |
          declare -A jobs
          start() { local name=$1; shift; "$@" > "/tmp/ci-$name.log" 2>&1 & jobs[$name]=$!; }
          start lint npm run lint
          start typecheck npm run typecheck
          start test npm test -- --ci
          start audit npm audit --omit=dev --audit-level=critical
          start bundle npx expo export --platform android --output-dir dist
          status=0
          for name in "${!jobs[@]}"; do
            if wait "${jobs[$name]}"; then result=ok; else result=FALHOU; status=1; fi
            echo "::group::$name ($result)"; cat "/tmp/ci-$name.log"; echo "::endgroup::"
            [ "$result" = ok ] || echo "::error::$name falhou"
          done
          exit $status

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Container efêmero só para os testes de integração; não é banco real nem guarda dados.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s
          --health-retries 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      MOBILE_TEST_MYSQL: Server=127.0.0.1;Port=3306;User ID=root
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json

      - run: dotnet restore
      - run: dotnet build --no-restore
      # Formatação, pacotes vulneráveis e testes em paralelo (os testes já rodam classes em paralelo no xUnit).
      - name: Format, vulneráveis e testes (paralelo)
        shell: bash
        run: |
          declare -A jobs
          start() { local name=$1; shift; "$@" > "/tmp/ci-$name.log" 2>&1 & jobs[$name]=$!; }
          vulnerable() { dotnet package list --vulnerable --include-transitive | tee vulnerable.txt && ! grep -q "has the following vulnerable packages" vulnerable.txt; }
          start format dotnet format --verify-no-changes --no-restore
          start vulnerable vulnerable
          start test dotnet test --no-build
          status=0
          for name in "${!jobs[@]}"; do
            if wait "${jobs[$name]}"; then result=ok; else result=FALHOU; status=1; fi
            echo "::group::$name ($result)"; cat "/tmp/ci-$name.log"; echo "::endgroup::"
            [ "$result" = ok ] || echo "::error::$name falhou"
          done
          exit $status
