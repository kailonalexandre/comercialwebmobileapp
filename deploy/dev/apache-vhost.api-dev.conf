# Apache do host (DEV): TLS de api.dev.infinitsolucoesweb.com.br -> nginx da API em 127.0.0.1:8088.
# Certificado: sudo certbot --apache -d api.dev.infinitsolucoesweb.com.br  (o certbot completa o bloco :443).
# Módulos: sudo a2enmod proxy proxy_http headers
<VirtualHost *:80>
    ServerName api.dev.infinitsolucoesweb.com.br
    ProxyPreserveHost On
    ProxyAddHeaders On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://127.0.0.1:8088/
    ProxyPassReverse / http://127.0.0.1:8088/
</VirtualHost>
