# Borda da API (DEV): rate limit ANTES da aplicação. Mesmos números do docs/ARCHITECTURE.md ("Borda").
# O Apache do host manda o IP do cliente em X-Forwarded-For; só ele (loopback/ponte do Docker) é confiável.
set_real_ip_from 127.0.0.1;
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=pair:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=refresh:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=default:10m rate=120r/m;
# Comprovante: uma sessão (token de acesso), para ninguém disparar WhatsApp em massa pelo número da empresa.
limit_req_zone $http_authorization zone=receipt:10m rate=20r/m;
limit_req_status 429;

upstream mobile_api { server mobile-api:8080; keepalive 8; }

server {
    listen 80;
    server_name _;
    client_max_body_size 64k;

    # A API enxerga o IP já resolvido pela borda (X-Forwarded-For sobrescrito, nunca repassado do cliente).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 40s;

    location = /api/v1/auth/pair { limit_req zone=pair burst=5 nodelay; proxy_pass http://mobile_api; }
    location = /api/v1/auth/refresh { limit_req zone=refresh burst=10 nodelay; proxy_pass http://mobile_api; }
    location ~ ^/api/v1/sales/[0-9]+/receipt/(whatsapp|pdf)$ { limit_req zone=receipt burst=5 nodelay; proxy_pass http://mobile_api; }
    location / { limit_req zone=default burst=40 nodelay; proxy_pass http://mobile_api; }
}
