# Migrations mobile_* (db/migrations). Roda UMA vez por release, ANTES de trocar a imagem da API, com a conta de DEPLOY
# (DDL em mobile_*), nunca com a conta mobile_api de execução. Quem aplica é o instalar-prod.sh (cria e apaga a conta).
apiVersion: batch/v1
kind: Job
metadata:
  name: mobile-api-migrate
  namespace: comercial-prod
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      # fsGroup: o secret do JWT é montado 0440 root:<fsGroup>; sem ele o UID 1654 não lê /jwt/jwt.pem (igual ao Deployment).
      securityContext: { runAsNonRoot: true, runAsUser: 1654, fsGroup: 1654, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: ghcr.io/kailonalexandre/comercialweb-mobile-api:MOBILE_API_IMAGE_TAG
          args: ["migrate"]
          env:
            - { name: ASPNETCORE_ENVIRONMENT, value: Production }
            - { name: DataProtection__KeysPath, value: /tmp/dp }
            - { name: Jwt__SigningKeyPath, value: /jwt/jwt.pem }
          envFrom:
            # Só a chave ConnectionStrings__ComercialWeb, com a conta de deploy. Ver secret.example.yaml.
            - secretRef: { name: mobile-api-migrate-env }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          volumeMounts:
            - { name: jwt, mountPath: /jwt, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: jwt
          secret: { secretName: mobile-api-jwt, defaultMode: 0440 }
        - name: tmp
          emptyDir: {}
