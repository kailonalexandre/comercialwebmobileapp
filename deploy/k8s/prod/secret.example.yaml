# EXEMPLO com placeholders. NUNCA coloque valores reais aqui nem versione um Secret preenchido.
# Crie os reais direto no cluster (comandos no docs/DEPLOY.md), por exemplo:
#   kubectl -n comercial-prod create secret generic mobile-api-env \
#     --from-literal=ConnectionStrings__ComercialWeb='Server=10.8.0.1;Port=3306;User ID=mobile_api;Password=<SENHA>;Database=comercial_web_prod' \
#     --from-literal=ComercialWeb__MobileApiSecret='<MESMO VALOR DE MOBILE_API_SECRET DO LARAVEL, 32+ CARACTERES>'
#   kubectl -n comercial-prod create secret generic mobile-api-migrate-env \
#     --from-literal=ConnectionStrings__ComercialWeb='Server=10.8.0.1;Port=3306;User ID=<CONTA DE DEPLOY>;Password=<SENHA>;Database=comercial_web_prod'
#   # Pull da imagem (GHCR do kailonalexandre): token clássico com SÓ o escopo read:packages, de uma conta com acesso ao pacote.
#   kubectl -n comercial-prod create secret docker-registry ghcr-pull-mobile \
#     --docker-server=ghcr.io --docker-username=kailonalexandre --docker-password='<TOKEN read:packages>'
#   openssl ecparam -name prime256v1 -genkey -noout -out jwt.pem   # chave EC P-256 do JWT
#   kubectl -n comercial-prod create secret generic mobile-api-jwt --from-file=jwt.pem=jwt.pem && shred -u jwt.pem
apiVersion: v1
kind: Secret
metadata: { name: mobile-api-env, namespace: comercial-prod }
type: Opaque
stringData:
  ConnectionStrings__ComercialWeb: "PREENCHER"
  ComercialWeb__MobileApiSecret: "PREENCHER"
